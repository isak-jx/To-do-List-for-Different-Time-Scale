<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusFlow 数据导出</title><style>body{font:18px/1.8 system-ui;max-width:720px;margin:80px auto;padding:24px;color:#202438;background:#f7f8fc}a{display:inline-block;padding:12px 24px;background:#4f46e5;color:white;border-radius:12px;text-decoration:none}p{margin:24px 0}</style><h1>导出原 FocusFlow 数据</h1><p>把下面的按钮拖到浏览器书签栏，然后在原 FocusFlow 网站点击这个书签。</p><a href="javascript:(function%20exportOriginal()%20%7B%0A%20%20if%20(location.origin%20!%3D%3D%20'https%3A%2F%2Fto-do-list-for-different-time-scale.vercel.app')%20%7B%0A%20%20%20%20alert('%E8%AF%B7%E5%9C%A8%E5%8E%9F%20FocusFlow%20%E7%BD%91%E7%AB%99%E7%82%B9%E5%87%BB%E6%AD%A4%E4%B9%A6%E7%AD%BE%E3%80%82')%3B%20return%3B%0A%20%20%7D%0A%20%20try%20%7B%0A%20%20%20%20const%20data%20%3D%20%7Bversion%3A%201%7D%3B%0A%20%20%20%20for%20(const%20key%20of%20%5B'tasks'%2C'longTermLists'%2C'dailyNotes'%2C'weeklyNotes'%2C'logTags'%2C'logEntries'%5D)%20%7B%0A%20%20%20%20%20%20const%20raw%20%3D%20localStorage.getItem(key)%3B%0A%20%20%20%20%20%20data%5Bkey%5D%20%3D%20raw%20%3F%20JSON.parse(raw)%20%3A%20%5B'dailyNotes'%2C'weeklyNotes'%5D.includes(key)%20%3F%20%7B%7D%20%3A%20%5B%5D%3B%0A%20%20%20%20%7D%0A%20%20%20%20const%20url%20%3D%20URL.createObjectURL(new%20Blob(%5BJSON.stringify(data%2C%20null%2C%202)%5D%2C%20%7Btype%3A'application%2Fjson'%7D))%3B%0A%20%20%20%20const%20a%20%3D%20document.createElement('a')%3B%20a.href%20%3D%20url%3B%20a.download%20%3D%20'focusflow-backup.json'%3B%20a.click()%3B%0A%20%20%20%20setTimeout(()%20%3D%3E%20URL.revokeObjectURL(url)%2C%201000)%3B%0A%20%20%7D%20catch%20(_)%20%7B%20alert('%E5%AF%BC%E5%87%BA%E5%A4%B1%E8%B4%A5%EF%BC%8C%E5%8E%9F%E6%95%B0%E6%8D%AE%E6%9C%AA%E4%BF%AE%E6%94%B9%E3%80%82')%3B%20%7D%0A%7D)()">导出 FocusFlow 数据</a><p>会下载包含任务、长期列表、每日与每周复盘、日志和标签的 JSON 文件。只读取原网站的六个已知存储键，不修改数据，不发送网络请求。</p><p>随后在 Google Calendar 插件的“数据 / 归档 → 导入旧数据”中粘贴 JSON，预览并确认。</p></html>
